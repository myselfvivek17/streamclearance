<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamClearance</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="/fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/app.css">
  <script>
    // Apply the saved theme before first paint (no flash of the wrong theme).
    try {
      var t = localStorage.getItem("sc.theme");
      if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
      }
    } catch (e) { /* storage blocked */ }
  </script>
</head>
<body>
<div class="app" id="app">
  <div id="mock-banner" class="banner" role="note" hidden>
    <strong>Mock mode.</strong> No model key is configured, so results are canned examples, not a real analysis.
  </div>

  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="#upload" style="color: inherit; text-decoration: none">
        <span class="brand-mark"><i class="ic ic-shield" aria-hidden="true"></i></span>StreamClearance
      </a>
      <nav class="grow" aria-label="Progress">
        <ol class="stepper" id="stepper"></ol>
      </nav>
      <button class="icon-btn" id="theme-btn" type="button"><i class="ic" aria-hidden="true"></i></button>
    </div>
  </header>

  <div id="view"><main class="main"><p class="loading">Loading…</p></main></div>

  <div class="toast" id="toast" role="status" hidden><i class="ic ic-info" aria-hidden="true"></i><span></span></div>

  <dialog id="access-dialog" class="access-dialog" aria-labelledby="access-title">
    <form method="dialog">
      <h2 class="h2" id="access-title">Access code</h2>
      <p class="small muted">This demo is protected. Enter the access code you were given.</p>
      <label class="sr-only" for="access-input">Access code</label>
      <input id="access-input" type="password" autocomplete="current-password" required>
      <div class="row"><button class="btn btn-primary" value="ok">Continue</button></div>
    </form>
  </dialog>
</div>
<script src="/app.js"></script>
</body>
</html>
